name: Refresh data

on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of every month
  workflow_dispatch:        # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python3 scraper/refresh.py
      - name: Commit if data changed
        run: |
          if git diff --quiet -- data/; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Refresh MIT catalog and OCW data ($(date -u +%Y-%m-%d))"
            git push
          fi
